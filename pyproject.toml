[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macvoice"
version = "0.1.0"
description = "Offline TTS (Kokoro-82M) for Apple Silicon: one CLI, mlx always works, CoreML/ANE when artifacts are present."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["tts", "kokoro", "mlx", "coreml", "apple-silicon", "speech"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Programming Language :: Python :: 3",
]

[project.scripts]
macvoice = "macvoice:main"

[tool.setuptools]
py-modules = ["macvoice"]

[project.optional-dependencies]
mlx = ["mlx-audio>=0.6.3", "misaki[en]>=0.9.4"]
coreml = [
  "torch==2.5.0",
  "coremltools==8.3.0",
  "numpy==1.26.4",
  "transformers==4.44.2",
  "huggingface_hub",
  "loguru",
  "misaki[en]>=0.9.4",
  "soundfile",
  "pyobjc-framework-CoreML",
]
